global:
  scrape_interval: 3s
  evaluation_interval: 3s

scrape_configs:
  - job_name: mnist_api
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8000

  - job_name: mnist_lifecycle
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9108